<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="fmTitle fmDesc">
  <title id="fmTitle">FORWARD belgisi</title>
  <desc id="fmDesc">Oltin "F" monogrammasi oldinga yo'nalgan shevron-strelka bilan birlashgan, nozik geometrik halqa ichida — FORWARD brend belgisi.</desc>

  <defs>
    <linearGradient id="fm-gold" x1="14" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8c96a"/>
      <stop offset="0.5" stop-color="#c9a84c"/>
      <stop offset="1" stop-color="#a8862f"/>
    </linearGradient>
  </defs>

  <!-- Subtle ring frame (echoes the heraldic crest border) -->
  <circle cx="32" cy="32" r="29" stroke="url(#fm-gold)" stroke-width="1.6" stroke-opacity="0.32"/>
  <circle cx="32" cy="32" r="25.5" stroke="url(#fm-gold)" stroke-width="1" stroke-opacity="0.18"/>

  <!-- The "F" as a solid geometric monogram: stem + top arm + middle arm -->
  <path d="M18 14
           H38 V21 H25 V29 H35 V36 H25 V50 H18 Z"
        fill="url(#fm-gold)"/>

  <!-- Forward chevron / arrow emerging to the right (the "forward" motion) -->
  <path d="M37 21 L49 32 L37 43 L37 35.5 L42 32 L37 28.5 Z"
        fill="url(#fm-gold)"/>
</svg>
