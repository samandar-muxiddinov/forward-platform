<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 152" fill="none" role="img" aria-labelledby="nxTitle nxDesc">
  <title id="nxTitle">Nexus daraja belgisi</title>
  <desc id="nxDesc">Oltin qalqon ichida bitta yuqoriga yo'nalgan shevron — Nexus, birinchi daraja. Ko'k urg'u.</desc>

  <defs>
    <linearGradient id="nx-fill" x1="64" y1="30" x2="64" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4e9eff" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#4e9eff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#0a0f1e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nx-gold" x1="24" y1="26" x2="104" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8c96a"/>
      <stop offset="0.5" stop-color="#c9a84c"/>
      <stop offset="1" stop-color="#a8862f"/>
    </linearGradient>
  </defs>

  <!-- Shield: faint inner tint -->
  <path d="M64 30 L108 38 V92 C108 118 88 134 64 142 C40 134 20 118 20 92 V38 Z" fill="url(#nx-fill)"/>
  <!-- Shield: gold border -->
  <path d="M64 30 L108 38 V92 C108 118 88 134 64 142 C40 134 20 118 20 92 V38 Z"
        stroke="url(#nx-gold)" stroke-width="3" stroke-linejoin="round"/>
  <!-- Shield: subtle inner line -->
  <path d="M64 36 L102 42.8 V91 C102 113.5 84.5 128 64 135.4 C43.5 128 26 113.5 26 91 V42.8 Z"
        stroke="#c9a84c" stroke-width="1.3" stroke-linejoin="round" stroke-opacity="0.5"/>

  <!-- Rank mark: one chevron -->
  <path d="M44 102 L64 88 L84 102" stroke="#4e9eff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
