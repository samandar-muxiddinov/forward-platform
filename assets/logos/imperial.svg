<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 152" fill="none" role="img" aria-labelledby="imTitle imDesc">
  <title id="imTitle">Imperial daraja belgisi</title>
  <desc id="imDesc">Oltin qalqon ichida uchta yuqoriga yo'nalgan shevron — Imperial, yuqori daraja. Oltin urg'u.</desc>

  <defs>
    <linearGradient id="im-fill" x1="64" y1="30" x2="64" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8c96a" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#c9a84c" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0a0f1e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="im-gold" x1="24" y1="26" x2="104" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8c96a"/>
      <stop offset="0.5" stop-color="#c9a84c"/>
      <stop offset="1" stop-color="#a8862f"/>
    </linearGradient>
  </defs>

  <!-- Shield: faint inner tint -->
  <path d="M64 30 L108 38 V92 C108 118 88 134 64 142 C40 134 20 118 20 92 V38 Z" fill="url(#im-fill)"/>
  <!-- Shield: gold border -->
  <path d="M64 30 L108 38 V92 C108 118 88 134 64 142 C40 134 20 118 20 92 V38 Z"
        stroke="url(#im-gold)" stroke-width="3" stroke-linejoin="round"/>
  <!-- Shield: subtle inner line -->
  <path d="M64 36 L102 42.8 V91 C102 113.5 84.5 128 64 135.4 C43.5 128 26 113.5 26 91 V42.8 Z"
        stroke="#c9a84c" stroke-width="1.3" stroke-linejoin="round" stroke-opacity="0.5"/>

  <!-- Rank mark: three chevrons (all-gold = pinnacle) -->
  <g stroke="url(#im-gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 84 L64 70 L84 84"/>
    <path d="M44 102 L64 88 L84 102"/>
    <path d="M44 120 L64 106 L84 120"/>
  </g>
</svg>
