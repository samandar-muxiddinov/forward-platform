<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="favTitle">
  <title id="favTitle">FORWARD</title>

  <!-- Dark-navy rounded tile so the mark reads on any tab background -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#0a0f1e"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="5.6" fill="none"
        stroke="#c9a84c" stroke-width="1.4" stroke-opacity="0.55"/>

  <!-- Solid "F" monogram, sized for 16px legibility -->
  <path d="M9 7 H21 V11 H13.5 V14.5 H19.5 V18.5 H13.5 V25 H9 Z" fill="#e8c96a"/>

  <!-- Compact forward chevron -->
  <path d="M19.5 11 L25.5 16 L19.5 21 L19.5 17 L21.5 16 L19.5 15 Z" fill="#e8c96a"/>
</svg>
